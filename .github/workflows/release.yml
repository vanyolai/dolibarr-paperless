name: Build and publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix (leave empty to read module descriptor)"
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - '.release-trigger-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version || '' }}"
          if [ -z "$VERSION" ]; then
            TRIGGER="$(find . -maxdepth 1 -type f -name '.release-trigger-v*' -print -quit)"
            if [ -n "$TRIGGER" ]; then
              VERSION="${TRIGGER#./.release-trigger-v}"
            fi
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(sed -n "s/.*\$this->version = '\([^']*\)'.*/\1/p" core/modules/modPaperless.class.php | head -n1)"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=module_paperless-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build Dolibarr module ZIP
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ARCHIVE: ${{ steps.meta.outputs.archive }}
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/paperless
          rsync -a ./ build/paperless/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build' \
            --exclude '.release-trigger-v*'
          (cd build && zip -qr "$ARCHIVE" paperless)
          unzip -l "build/$ARCHIVE"

      - name: Prepare release notes
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found=1; next }
            found && $0 ~ "^## \\[" { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf 'Dolibarr Paperless %s\n' "$VERSION" > release-notes.md
          fi

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          ARCHIVE: ${{ steps.meta.outputs.archive }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$TAG" "build/$ARCHIVE#Dolibarr installable module ZIP" \
            --target "$GITHUB_SHA" \
            --title "Dolibarr Paperless $VERSION" \
            --notes-file release-notes.md
